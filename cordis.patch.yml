# qqpilot-dsh-plugin bundle layer — applied when a profile lists this bundle.
# `name` is this package's name (resolved through the profile node_modules).
#
# Config values below are the defaults; the settings card (Settings → QQPilot)
# writes runtime overrides to ~/.dsh/qqpilot-dsh-plugin.json.
- insert:
    - id: qqpilot-dsh-plugin
      name: qqpilot-dsh-plugin
      config:
        compatibilityMode: false
